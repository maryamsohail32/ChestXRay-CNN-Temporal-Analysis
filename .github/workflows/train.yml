name: Train CNN Model

on:
  workflow_dispatch: # Allows you to manually click a button to run training

jobs:
  build-and-train:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run training script
      run: python cnn_xray_pneumonia.py

    - name: Commit and push best_model.h5
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add best_model.h5 fig1_training_curves.png fig2_confusion_roc.png fig3_temporal.png fig4_model_comparison.png
        git commit -m "Automated training: updated model weights and figures" || echo "No changes to commit"
        git push
